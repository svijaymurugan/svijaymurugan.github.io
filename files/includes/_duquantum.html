<!--
  DuQuantum announcement, injected above the about block on the homepage.
  Wired up in index.qmd via: format.html.include-before-body

  NOTE: must be a <div>, never an <aside>. Quarto's grid CSS has
  `aside:not(.footnotes):not(.sidebar){grid-column:body-end/page-end}`, which
  throws the element into the right margin column.

  The column-body class matches the class Quarto puts on the about block
  (.quarto-about-trestles) so the two line up on the same grid column.

-->
<div class="duq-banner">
  <p class="duq-title">
    <a class="duq-link" href="https://duquantum.org" target="_blank" rel="noopener"><span class="duq-brand">DuQuantum</span> Applications Open!</a>
  </p>
  <p class="duq-blurb">
    DuQuantum is the first annual quantum computing hackathon at Duke. We invite quantum
    enthusiasts to tackle challenges designed by industry leaders and gain experience with
    state-of-the-art quantum tools. All undergrad, Master’s and PhD students are eligible.
  </p>
  <hr class="duq-rule">
</div>
